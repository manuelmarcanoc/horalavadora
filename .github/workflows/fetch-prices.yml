name: Actualizar precios de la luz

on:
  schedule:
    # Cada hora, minuto 5 (UTC)
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch datos REData
        run: |
          for i in 1 2 3; do
            node scripts/fetch-redata.mjs && exit 0
            echo "Intento $i fallido, reintentando en 30s…"
            sleep 30
          done
          exit 1

      - name: Commit y push data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data.json public/index.html public/sitemap.xml
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos"
            exit 0
          fi
          git commit -m "data: precios $(date +'%Y-%m-%d %H:%M') UTC"
          git push
