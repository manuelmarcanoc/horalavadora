name: Update ESIOS data.json

on:
  workflow_dispatch:
  schedule:
    # Cada hora (UTC). El frontend usa TZ Europe/Madrid al renderizar.
    - cron: "7 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install (minimal)
        run: npm install

      - name: Fetch ESIOS and write public/data.json
        env:
          ESIOS_TOKEN: ${{ secrets.ESIOS_TOKEN }}
          # Opcional:
          # ESIOS_INDICATOR_ID: "1001"
          # ESIOS_GEO_ID: "3"
        run: npm run fetch

      - name: Commit updated data.json
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git add public/data.json
          git commit -m "chore(data): update ESIOS prices"
          git push

